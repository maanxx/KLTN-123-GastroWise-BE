events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format with Correlation ID
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                    'correlation_id="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Rate Limiting Zones: 10MB zone allows ~160,000 IP states
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Whitelist map for CORS origins (Web, Mobile, Admin dashboards)
    map $http_origin $cors_allowed_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
        "https://gastrowise.vn" "$http_origin";
        "https://admin.gastrowise.vn" "$http_origin";
        "https://api.gastrowise.vn" "$http_origin";
    }

    map $cors_allowed_origin $cors_allow_credentials {
        default "";
        "~^https?://" "true";
    }

    upstream core_service {
        server core-service:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream planning_service {
        server planning-service:3003 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Inject X-Correlation-Id if missing
        set $corr_id $http_x_correlation_id;
        if ($corr_id = "") {
            set $corr_id $request_id;
        }

        # Global Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $corr_id;
        proxy_hide_header X-Correlation-Id;
        add_header X-Correlation-Id $corr_id always;

        # CORS Headers for Whitelisted Mobile, Web, and Admin clients
        add_header 'Access-Control-Allow-Origin' $cors_allowed_origin always;
        add_header 'Access-Control-Allow-Credentials' $cors_allow_credentials always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Correlation-Id,X-Result-Truncated,X-Total-Count,X-Result-Limit,X-Legacy-Endpoint,Deprecation,Link,Warning' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # Preflight handling
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Gateway Health Probe
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"nginx-api-gateway","timestamp":"$time_iso8601"}';
        }

        # -------------------------------------------------------------
        # PLANNING SERVICE ROUTING
        # Priority 1: /api/v1/itineraries/*
        # -------------------------------------------------------------
        location /api/v1/itineraries {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://planning_service;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # -------------------------------------------------------------
        # CORE SERVICE ROUTING
        # Priority 2: /api/v1/auth/* (strict rate limiting)
        # -------------------------------------------------------------
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://core_service;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
        }

        # Priority 3: All other /api/v1/* routes
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://core_service;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # -------------------------------------------------------------
        # BACKWARD-COMPATIBILITY REWRITES
        # Rewrites legacy routes without /api/v1 prefix to canonical /api/v1/...
        # -------------------------------------------------------------
        location ~ ^/(itineraries)(/.*)?$ {
            rewrite ^/(itineraries)(/.*)?$ /api/v1/$1$2 last;
        }

        location ~ ^/(auth|users|restaurants|reviews|favorites|taste-dna|interactions|contacts)(/.*)?$ {
            rewrite ^/(auth|users|restaurants|reviews|favorites|taste-dna|interactions|contacts)(/.*)?$ /api/v1/$1$2 last;
        }

        # Static assets forwarded to Core Service
        location /uploads/ {
            proxy_pass http://core_service;
            proxy_cache_valid 200 1d;
        }
    }
}
