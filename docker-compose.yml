version: '3.8'

services:
  # 1. PostgreSQL with PostGIS for Spatial Data (Tọa độ Bản đồ)
  postgres:
    image: postgis/postgis:15-3.3
    container_name: gastrowise_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-gastrowise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gastrowise_net

  # 2. Redis for Caching (Cache kết quả AI, Session)
  redis:
    image: redis:7-alpine
    container_name: gastrowise_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gastrowise_net

  # 3. Backend API (NestJS / Node.js) - Will be built later
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: gastrowise_api
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/${DB_NAME:-gastrowise}
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - gastrowise_net

volumes:
  postgres_data:
  redis_data:

networks:
  gastrowise_net:
    driver: bridge
