# ==============================================================================
# GASTROWISE MICROSERVICES ARCHITECTURE DOCKER COMPOSE TOPOLOGY
# Milestone 2.2: Isolated Runtime & Networking Validation
# ==============================================================================

networks:
  gastrowise_network:
    driver: bridge

services:
  # -------------------------------------------------------------
  # ISOLATED TEST DATABASE (MongoDB 7.0)
  # Guaranteed 100% database isolation from MongoDB Atlas
  # -------------------------------------------------------------
  mongo-test:
    image: mongo:7.0
    container_name: gastrowise-mongo-test
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gastrowise_network
    restart: unless-stopped

  # -------------------------------------------------------------
  # API GATEWAY (Reverse Proxy & Ingress Traffic Router)
  # -------------------------------------------------------------
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: gastrowise-nginx-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      core-service:
        condition: service_started
      planning-service:
        condition: service_started
    networks:
      - gastrowise_network
    restart: unless-stopped

  # -------------------------------------------------------------
  # CORE SERVICE (Auth, Catalog, Reviews, Preferences)
  # -------------------------------------------------------------
  core-service:
    image: gastrowise-core-service:test
    build:
      context: .
      dockerfile: apps/core-service/Dockerfile
    container_name: gastrowise-core-service
    expose:
      - "3001"
    environment:
      - PORT=3001
      - CORE_SERVICE_PORT=3001
      - NODE_ENV=production
      - MONGODB_URI_CORE=${MONGODB_URI_CORE:-mongodb://mongo-test:27017/gastro_core_test}
      - CORE_DB_NAME=gastro_core_test
      - JWT_SECRET=${JWT_SECRET:-test_jwt_secret_32_characters_long_for_m22}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-test_internal_service_key_32_characters}
      - INTERNAL_AI_KEY=${INTERNAL_AI_KEY:-test_internal_ai_key_32_characters}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-test-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-test-client-secret}
      - AI_SERVICE_URL=http://ai-service:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      mongo-test:
        condition: service_healthy
    networks:
      - gastrowise_network
    restart: unless-stopped

  # -------------------------------------------------------------
  # PLANNING SERVICE (Itinerary Generation, TSPTW, Timetable)
  # -------------------------------------------------------------
  planning-service:
    image: gastrowise-planning-service:test
    build:
      context: .
      dockerfile: apps/planning-service/Dockerfile
    container_name: gastrowise-planning-service
    expose:
      - "3003"
    environment:
      - PORT=3003
      - PLANNING_SERVICE_PORT=3003
      - NODE_ENV=production
      - MONGODB_URI_PLANNING=${MONGODB_URI_PLANNING:-mongodb://mongo-test:27017/gastro_planning_test}
      - PLANNING_DB_NAME=gastro_planning_test
      - JWT_SECRET=${JWT_SECRET:-test_jwt_secret_32_characters_long_for_m22}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-test_internal_service_key_32_characters}
      - INTERNAL_AI_KEY=${INTERNAL_AI_KEY:-test_internal_ai_key_32_characters}
      - CORE_SERVICE_URL=http://core-service:3001
      - AI_SERVICE_URL=http://ai-service:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      mongo-test:
        condition: service_healthy
      core-service:
        condition: service_started
    networks:
      - gastrowise_network
    restart: unless-stopped

  # -------------------------------------------------------------
  # AI SERVICE (FastAPI Machine Learning & Optimization Engine)
  # -------------------------------------------------------------
  ai-service:
    image: gastrowise-ai-service:test
    build:
      context: ../KLTN-123-GastroWise-AI
      dockerfile: Dockerfile
    container_name: gastrowise-ai-service
    expose:
      - "5000"
    environment:
      - PORT=5000
      - INTERNAL_AI_KEY=${INTERNAL_AI_KEY:-test_internal_ai_key_32_characters}
      - MONGODB_URI=${MONGODB_URI_AI:-mongodb://mongo-test:27017/gastro_ai_test}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-gastro_ai_test}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      mongo-test:
        condition: service_healthy
    networks:
      - gastrowise_network
    restart: unless-stopped
